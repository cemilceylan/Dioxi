<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" width="240" height="240">
  <title>Dioxi</title>
  <defs>
    <g id="dioxi" stroke-linecap="round" stroke-linejoin="round">
      <!-- antenna, a little bent -->
      <path d="M118 66 C116 50 126 44 122 28" fill="none"/>
      <circle cx="122" cy="22" r="9" fill="#ffd23f"/>

      <!-- feet -->
      <path d="M84 198 L82 214 L104 214 L104 200" fill="#7d63d6"/>
      <path d="M138 200 L138 214 L160 214 L157 198" fill="#7d63d6"/>

      <!-- arms: one down, one waving -->
      <path d="M52 134 C38 142 36 158 44 166" fill="none"/>
      <path d="M188 128 C204 118 208 100 200 88" fill="none"/>

      <!-- body: slightly lopsided blob -->
      <path d="M70 72 C96 58 150 60 172 74 C194 90 196 150 186 176 C176 202 70 206 58 180 C46 152 46 88 70 72 Z" fill="#a48cf0"/>
    </g>
  </defs>

  <!-- white sticker border, then the outlined drawing -->
  <use xlink:href="#dioxi" stroke="#fff" stroke-width="20"/>
  <use xlink:href="#dioxi" stroke="#1b1b1f" stroke-width="6"/>

  <!-- eyes: different sizes, looking up and to the side -->
  <ellipse cx="96" cy="122" rx="12" ry="16" fill="#1b1b1f"/>
  <ellipse cx="144" cy="120" rx="14" ry="18" fill="#1b1b1f"/>
  <circle cx="100" cy="115" r="4.5" fill="#fff"/>
  <circle cx="149" cy="112" r="5.5" fill="#fff"/>

  <!-- mouth: small lopsided smile -->
  <path d="M110 152 Q119 162 130 150" fill="none" stroke="#1b1b1f" stroke-width="5" stroke-linecap="round"/>
</svg>
